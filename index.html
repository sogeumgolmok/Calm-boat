/* Layout: one full-screen 3D sea; where-am-I text top-left, three round buttons bottom-right with small panels above them */
:root{
  --night:#0b1026;
  --ink:#f4efe6;
  --ink-soft:rgba(244,239,230,.78);
  --glass:rgba(14,24,44,.38);
  --glass-strong:rgba(14,24,44,.72);
  --glass-line:rgba(244,239,230,.26);
  --lamp:#ffc77a;
  --display:"Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
  --body:"Gowun Dodum", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.where{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:max(18px, env(safe-area-inset-left,0px));
  display:grid;gap:2px;font-size:12px;color:var(--ink-soft);text-shadow:0 1px 6px rgba(0,0,0,.45);pointer-events:none;transition:opacity 1.2s}
.where .sea-name{font-family:var(--display);font-size:14px;letter-spacing:.08em;color:var(--ink)}
.where .coord{font-variant-numeric:tabular-nums;letter-spacing:.02em}

.dock{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;gap:10px;align-items:flex-end;transition:opacity 1.2s}
.round{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--ink);
  background:var(--glass);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.round svg{width:22px;height:22px}
.round[aria-expanded="true"]{background:var(--glass-strong)}
.round:focus-visible,.panel button:focus-visible,.board:focus-visible,.pill:focus-visible,.panel textarea:focus-visible,.panel input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.panel{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));
  width:min(300px, calc(100vw - 32px));box-sizing:border-box;padding:16px;border-radius:18px;display:grid;gap:12px;
  background:var(--glass-strong);border:1px solid var(--glass-line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.panel h2{margin:0;font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.04em}
.panel p{margin:0;font-size:13px;line-height:1.7;color:var(--ink-soft)}
.vol{display:flex;align-items:center;gap:10px}
.vol input{flex:1;min-width:0;accent-color:var(--lamp)}
.vol output{width:3ch;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink-soft)}
.credit{font-size:11px;line-height:1.6;color:var(--ink-soft);border-top:1px solid var(--glass-line);padding-top:10px}
.panel textarea{width:100%;box-sizing:border-box;min-height:84px;resize:none;border-radius:12px;padding:10px 12px;
  font:15px/1.6 var(--body);color:var(--ink);background:rgba(244,239,230,.08);border:1px solid var(--glass-line);-webkit-user-select:text;user-select:text}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.btn{font:14px var(--body);color:#1d1408;background:var(--lamp);border:0;border-radius:999px;padding:9px 18px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:default}
.btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--glass-line)}
.letter{font-family:var(--display);font-size:17px;line-height:1.8;color:var(--ink);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;
  padding:14px 14px;border-radius:12px;background:rgba(244,232,205,.1);border:1px solid rgba(244,232,205,.22)}

.pill{position:fixed;left:50%;transform:translateX(-50%);
  font:14px var(--body);color:var(--ink);background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:999px;
  padding:10px 18px;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);white-space:nowrap;transition:opacity .8s}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));
  font-size:13px;color:var(--ink);background:var(--glass-strong);border-radius:999px;padding:8px 16px;pointer-events:none;transition:opacity .8s;white-space:nowrap}
.hint{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));text-align:center;
  font-size:13px;color:var(--ink-soft);text-shadow:0 1px 6px rgba(0,0,0,.5);pointer-events:none;transition:opacity 2s}

.intro{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));

.intro-inner{display:grid;gap:18px;justify-items:center;max-width:22rem}
.intro h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,9vw,52px);letter-spacing:.12em;text-shadow:0 2px 18px rgba(0,0,0,.4);text-wrap:balance}
.intro p{margin:0;font-size:15px;line-height:1.8;color:var(--ink-soft);text-shadow:0 1px 8px rgba(0,0,0,.5)}
.board{margin-top:8px;font-family:var(--display);font-size:16px;letter-spacing:.06em;color:var(--ink);

.loading{font-size:12px;color:var(--ink-soft)}
.fade{opacity:0;pointer-events:none}
[hidden]{display:none!important}
</style>

/* ---------- renderer ---------- */
const canvas=$('sea');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.6));
renderer.toneMapping=THREE.ACESFilmicToneMapping;

/* ---------- sky ---------- */
function setupSky(s){ s.scale.setScalar(10000); const u=s.material.uniforms;
  u.turbidity.value=3.2; u.rayleigh.value=2.3; u.mieCoefficient.value=0.004; u.mieDirectionalG.value=0.82; }
const sky=new Sky(); setupSky(sky); scene.add(sky);
const envSky=new Sky(); setupSky(envSky); const envScene=new THREE.Scene(); envScene.add(envSky);
const pmrem=new THREE.PMREMGenerator(renderer); let envRT=null, lastEnvElev=999;

const starGeo=new THREE.BufferGeometry(); const sp=[];
for(let i=0;i<1600;i++){ const u=Math.random(), v=Math.random()*0.97+0.03, th=2*Math.PI*u, ph=Math.acos(v);
  sp.push(4000*Math.sin(ph)*Math.cos(th),4000*Math.cos(ph),4000*Math.sin(ph)*Math.sin(th)); }
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
const starMat=new THREE.PointsMaterial({color:0xfff6e8,size:1.6,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false});
const stars=new THREE.Points(starGeo,starMat); scene.add(stars);

function glowTex(inner,outer,core=0.18){
  const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d');
  const gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,inner); gr.addColorStop(core,inner); gr.addColorStop(core+0.04,outer); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,128); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t;
}

moon.scale.setScalar(900); scene.add(moon);

function seaPalette(h){
  let i=0; while(i<SEA_KEYS.length-2 && h>=SEA_KEYS[i+1][0]) i++;
  const a=SEA_KEYS[i], b=SEA_KEYS[i+1], t=smooth(0,1,(h-a[0])/(b[0]-a[0]));
  return [1,2,3,4,5].map(j=>a[j].clone().lerp(b[j],t));
}

    varying vec3 vWorld;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);

    float height(vec2 p){

      v+=0.35*sin(dot(p,vec2(-0.06,0.15))+t*0.38+1.3);
      v+=0.22*sin(dot(p,vec2(0.21,-0.12))+t*0.62+2.1);
      v+=0.70*noise(p*0.13+vec2(t*0.03,-t*0.02));
      v+=0.28*noise(p*0.42+vec2(-t*0.07,t*0.05));
      v+=0.07*noise(p*1.7+vec2(t*0.22,t*0.17));

    }
    void main(){
      vec2 p=vWorld.xz;
      float dist=length(cameraPosition.xz-p);
      float e=0.12+dist*0.004;
      float hx=(height(p+vec2(e,0.0))-height(p-vec2(e,0.0)))/(2.0*e);
      float hz=(height(p+vec2(0.0,e))-height(p-vec2(0.0,e)))/(2.0*e);
      float soft=1.0-smoothstep(30.0,400.0,dist);
      vec3 n=normalize(vec3(-hx*0.42*soft,1.0,-hz*0.42*soft));
      vec3 V=normalize(cameraPosition-vWorld);

      float fold=dot(n,normalize(vec3(0.35,1.0,-0.25)));

      float fres=pow(1.0-max(dot(n,V),0.0),4.0);

        float r=hash(cell); vec2 pos=vec2(hash(cell+3.1),hash(cell+7.7))*0.7+0.15;
        float tw=sin(uTime*(1.6+r*3.5)+r*40.0)*0.5+0.5;
        float d=length(f-pos);
        spark+=smoothstep(0.14,0.0,d)*pow(tw,10.0)*step(0.5,r);
      }
      spark*=(0.35+2.4*facing)*(1.0-smoothstep(10.0,70.0,dist));
      float path=pow(max(dot(reflect(-L,n),V),0.0),40.0)*smoothstep(20.0,120.0,dist);
      col+=uSpark*(spark*0.9+path*0.6);
      // lantern light pooling on the water
      float ld=length(p-uLantern.xz);
      col+=vec3(1.0,0.66,0.34)*uLanternI*exp(-ld*ld*0.09)*0.55;
      // fade to the haze at the horizon
      col=mix(col,uHorizon,smoothstep(70.0,1400.0,dist));

      vec2 b=(p-uBoat.xz)*vec2(1.0,0.55);
      float alpha=mix(0.38,1.0,smoothstep(1.6,4.2,length(b)));
      gl_FragColor=vec4(col,alpha);
    }`

function shadeTwo(geo,back,belly,band,stripe){
  const p=geo.attributes.position, c=new Float32Array(p.count*3), col=new THREE.Color();
  for(let i=0;i<p.count;i++){ const y=p.getY(i); col.copy(belly).lerp(back,smooth(-band,band,y));
    if(stripe&&Math.abs(y-stripe.y)<stripe.w) col.lerp(stripe.c,0.85);
    c[i*3]=col.r; c[i*3+1]=col.g; c[i*3+2]=col.b; }
  geo.setAttribute('color',new THREE.BufferAttribute(c,3)); return geo;
}
function finShape(pts){ const s=new THREE.Shape(); s.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) s.lineTo(pts[i][0],pts[i][1]); s.closePath(); return s; }
function vFin(pts,depth,mat,col){ // a fin standing in the body's vertical plane; shape x runs toward the tail
  const g=new THREE.ExtrudeGeometry(finShape(pts),{depth,bevelEnabled:false}); g.rotateY(-Math.PI/2); g.translate(depth/2,0,0);

}

}

canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===2){ const [a,b]=[...pointers.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); zoom0=zoom; if(downAt) downAt.moved=true; } });

  else if(pointers.size===2){ const [a,b]=[...pointers.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); if(pinch0>0) zoom=clamp(zoom0*pinch0/d,1.6,11); } });

  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime((whale?0.16:0.09)*k,now+(whale?0.12:0.04)); g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
  s.connect(f).connect(g).connect(master); s.start(now,Math.random()*2); s.stop(now+dur+0.05); }
function soundChime(far){ if(!ac||volume===0) return; const now=ac.currentTime;
  for(const [f,a] of [[1046.5,1],[1568,0.45]]){ const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f;
    const g=ac.createGain(); g.gain.setValueAtTime(0.0001,now); g.gain.exponentialRampToValueAtTime((far?0.025:0.05)*a,now+0.02); g.gain.exponentialRampToValueAtTime(0.0001,now+2.2);
    o.connect(g).connect(master); o.start(now); o.stop(now+2.3); } }

/* ---------- loop ---------- */
const SPEED=0.85;
let t=0, last=performance.now(), skyTimer=0, started=false, bottleTimer=45;
updateSky();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
  skyTimer-=dt; if(skyTimer<=0){ updateSky(); skyTimer=20; }

  boat.position.z-=SPEED*dt;
  boat.position.y=-0.2+(reduce?0:0.035*Math.sin(t*1.1)+0.02*Math.sin(t*0.53));
  boat.rotation.z=reduce?0:0.028*Math.sin(t*0.7)+0.012*Math.sin(t*0.31);
  boat.rotation.x=reduce?0:0.014*Math.sin(t*0.9+1);
  if(started){ travelled+=SPEED*dt; saveTimer-=dt; if(saveTimer<=0){ saveTimer=1; showWhere(); if(Math.random()<0.1) store.set('calmsea.dist',travelled.toFixed(1)); } }

  sea.position.set(boat.position.x,0,boat.position.z); deep.position.x=boat.position.x; deep.position.z=boat.position.z;
  stars.position.set(boat.position.x,0,boat.position.z);
  moon.position.copy(boat.position).addScaledVector(moonDir,3500);
  const U=seaMat.uniforms; U.uTime.value+=dt*(reduce?0.3:1); U.uBoat.value.copy(boat.position);
  tmp.copy(lanternLocal); boat.localToWorld(tmp); U.uLantern.value.copy(tmp);

  const look=Math.sin(t*0.11)*0.7+Math.sin(t*0.037)*0.4, up=Math.max(0,Math.sin(t*0.07+2))*0.45;
  buddy.head.rotation.set(reduce?0:-up*0.35, reduce?0:look*0.08, reduce?0:Math.sin(t*0.5)*0.04);
  buddy.g.rotation.z=reduce?0:Math.sin(t*0.6)*0.03;

  myBlink=Math.max(0,myBlink-dt); const flash=myBlink>0?Math.sin(Math.PI*(1-myBlink/1.6)):0;
  for(const m of lanternMats) m.emissiveIntensity=0.15+night*3.5+flash*6;
  if(lanternLight) lanternLight.intensity=night*2.2+flash*4;
  U.uLanternI.value=night*1.0+flash*1.4;
  myGlow.material.opacity=night*0.55+flash; myGlow.scale.setScalar(1.6+flash*2.5);

  emitWake(dt); updateFoam(dt); updateJumper(dt); updatePod(); updateSurfacer(dt); updateMeteor(dt); updateEncounter(dt); updateMist(dt); updateFishing(dt); updateOthers(dt);
  updateBottles(dt);
  updateCamera(dt);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
ready.then(()=>{ $('loading').hidden=true; });

/* ---------- panels ---------- */
const panels={sound:$('soundPanel'),write:$('writePanel'),read:$('readPanel'),catch:$('catchPanel')};
function openPanel(name){
  for(const [k,el] of Object.entries(panels)) el.hidden=k!==name;
  $('soundBtn').setAttribute('aria-expanded',String(name==='sound'));
  $('bottleBtn').setAttribute('aria-expanded',String(name==='write'));
}
let toastTimer=0;
function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.remove('fade'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.add('fade'),2600); }
canvas.addEventListener('pointerdown',()=>{ if(!panels.read.hidden||!panels.catch.hidden) return; openPanel(null); });
$('fishPill').addEventListener('click',startCast);
$('releaseBtn').addEventListener('click',releaseCatch);

$('soundBtn').addEventListener('click',()=>openPanel(panels.sound.hidden?'sound':null));
const vol=$('vol');
const savedVol=parseInt(store.get('calmsea.vol'),10); if(!isNaN(savedVol)){ vol.value=savedVol; }
function applyVol(){ volume=vol.value/100; $('volOut').value=vol.value; $('spkOn').hidden=volume===0; $('spkOff').hidden=volume!==0;
  if(master) master.gain.setTargetAtTime(gainFor(volume),ac.currentTime,0.2); }
vol.addEventListener('input',applyVol); vol.addEventListener('change',()=>store.set('calmsea.vol',vol.value)); applyVol();

/* ---------- shared sea: room for boats and blinks, db for bottles ---------- */
let room=null, db=null, myId=null;
function blinkMine(){ myBlink=1.6; soundChime(false); }
$('lampBtn').addEventListener('click',()=>{ blinkMine(); if(room&&room.connected()) room.emit('blink',{}).catch(()=>{}); });

async function connectShared(){
  const cl=window.claude; if(!cl||!cl.use) return;
  cl.use('room').then(r=>{ if(!r) return; room=r;
    const sync=ch=>{ for(const p of ch.peers){ if(!p.sameTab&&p.kind==='viewer'&&p.presence&&p.presence.boat) addOther(p.peer); }
      for(const p of ch.left) removeOther(p.peer);
      for(const peer of [...others.keys()]) if(!ch.peers.some(p=>p.peer===peer)) removeOther(peer); };
    room.onPeers(sync,()=>{});
    room.on('blink',msg=>{ if(msg.sameTab) return; const o=others.get(msg.peer); if(o){ o.blink=1.6; soundChime(true); } },()=>{});
    if(started) room.presence({boat:1}).catch(()=>{});
  });
  const [d,u]=await Promise.all([cl.use('db'),cl.use('user')]);
  if(!d) return; db=d;
  if(u){ try{ myId=await u.id(); }catch(_){} }
  let canWrite=true; if(u){ try{ const c=await u.can('data.write'); if(c===false) canWrite=false; }catch(_){} }
  $('bottleBtn').hidden=!canWrite;
  db.collection('bottles').orderBy('at','desc').limit(80).onSnapshot(snap=>{ letters=snap.docs.map(s=>({id:s.id,...s.data()})); },()=>{});
}
let letters=[];
const readSet=new Set((store.get('calmsea.read')||'').split(',').filter(Boolean));
function pickLetter(){
  const pool=letters.filter(l=>l&&typeof l.text==='string'&&l.text.trim()&&l.by!==myId&&!readSet.has(l.id));
  if(!pool.length) return null; return pool[Math.floor(Math.random()*pool.length)];
}
function updateBottles(dt){
  if(started&&!drift.visible){ bottleTimer-=dt;
    if(bottleTimer<=0){ bottleTimer=240+Math.random()*180; const l=pickLetter();
      if(l){ driftLetter=l; drift.visible=true; drift.position.set(boat.position.x+(Math.random()<.5?-1:1)*(1.6+Math.random()*0.6),0,boat.position.z-14); } } }
  if(drift.visible){
    drift.position.y=0.02+Math.sin(t*1.6)*0.03; drift.rotation.y=t*0.15;
    const rel=drift.position.z-boat.position.z;
    const near=rel>-9&&rel<4; $('bottlePill').classList.toggle('fade',!near); $('bottlePill').tabIndex=near?0:-1;
    if(rel>9){ drift.visible=false; driftLetter=null; bottleTimer=90; $('bottlePill').classList.add('fade'); }
  }
  if(tossT>=0){ tossT+=dt; const s=Math.min(1,tossT/1.2);
    tossed.visible=true;
    tossed.position.set(tossFrom.x+s*1.6,lerp(tossFrom.y,0.02,s)+Math.sin(Math.PI*s)*0.9,tossFrom.z+s*1.2);
    if(s>=1){ if(tossT<1.3) splash(tossed.position.x,tossed.position.z,false); tossed.position.y=0.02+Math.sin(t*1.6)*0.03;
      if(tossed.position.z-boat.position.z>14){ tossed.visible=false; tossT=-1; } } }
}
function openDrift(){
  if(!driftLetter) return;
  $('letterText').textContent=driftLetter.text.slice(0,80);
  const days=Math.floor((Date.now()-(driftLetter.at||Date.now()))/86400000);
  $('letterWhen').textContent=days<1?'오늘 띄운 편지':`${days}일 전에 띄운 편지`;
  readSet.add(driftLetter.id); store.set('calmsea.read',[...readSet].slice(-200).join(','));
  drift.visible=false; $('bottlePill').classList.add('fade'); soundSplash(0.4);
  openPanel('read');
}
$('bottlePill').addEventListener('click',openDrift);
$('releaseLetter').addEventListener('click',()=>{ openPanel(null); tossFrom.set(boat.position.x+0.4,0.9,boat.position.z+SEAT_Z); tossT=0; driftLetter=null; });

$('bottleBtn').addEventListener('click',()=>{ openPanel(panels.write.hidden?'write':null); if(!panels.write.hidden) setTimeout(()=>$('letterInput').focus(),50); });
const input=$('letterInput');
input.addEventListener('input',()=>{ $('letterCount').textContent=`${input.value.length} / 80`; $('sendLetter').disabled=!input.value.trim(); });
let sending=false;
$('sendLetter').addEventListener('click',async()=>{
  const text=input.value.trim().slice(0,80); if(!text||!db||sending) return;
  sending=true; $('sendLetter').disabled=true;
  try{
    const ref=db.collection('bottles').doc(); readSet.add(ref.id);
    await ref.set({text,at:Date.now(),by:myId||null});
    store.set('calmsea.read',[...readSet].slice(-200).join(','));
    input.value=''; $('letterCount').textContent='0 / 80'; openPanel(null);
    tossFrom.set(boat.position.x+0.4,0.9,boat.position.z+SEAT_Z); tossT=0; soundSplash(0.4);
    toast('바다에 띄웠어요');
  }catch(e){ toast(e&&e.code==='quota_exceeded'?'바다에 병이 너무 많아요':'지금은 띄울 수 없어요'); $('sendLetter').disabled=false; }
  sending=false;
});

/* ---------- start ---------- */
connectShared();
$('board').addEventListener('click',()=>{
  started=true;
  try{ initAudio(); if(ac&&ac.state==='suspended') ac.resume(); }catch(_){}
  $('intro').classList.add('fade'); $('dock').classList.remove('fade'); $('where').classList.remove('fade');
  const hint=$('hint'); hint.classList.remove('fade'); setTimeout(()=>hint.classList.add('fade'),7000);
  if(room) room.presence({boat:1}).catch(()=>{});
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{}); }catch(_){}
});
addEventListener('pagehide',()=>store.set('calmsea.dist',travelled.toFixed(1)));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) store.set('calmsea.dist',travelled.toFixed(1));
  if(!ac) return; if(document.hidden) ac.suspend(); else ac.resume(); });
</script>
